name: T3 Code Linux ARM64 server bundle

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build T3 Code Linux ARM64 server bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      T3CODE_TELEMETRY_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Verify the runtime-default change
        run: |
          vp fmt --check \
            packages/contracts/src/orchestration.ts \
            packages/contracts/src/orchestration.test.ts \
            apps/web/src/types.ts \
            apps/web/src/composerDraftStore.test.ts
          vp test run \
            packages/contracts/src/orchestration.test.ts \
            apps/web/src/composerDraftStore.test.ts
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/web typecheck

      - name: Build the server and web client
        run: |
          node scripts/update-release-package-versions.ts 0.0.32
          vp run --filter @t3tools/web build
          node apps/server/scripts/cli.ts build --verbose
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml

      - name: Assemble the locked production runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64

          deploy_root="$RUNNER_TEMP/t3-deploy"
          archive_name=t3code-server-0.0.32-aaiyer.0-linux-arm64
          archive_root="$RUNNER_TEMP/$archive_name"
          output_root="$RUNNER_TEMP/runtime-output"

          corepack pnpm --filter t3 deploy --prod --legacy "$deploy_root"
          install -d "$deploy_root/dist/resource-monitor/linux-arm64"
          install -m 0755 \
            native/resource-monitor/target/release/t3-resource-monitor \
            "$deploy_root/dist/resource-monitor/linux-arm64/t3-resource-monitor"

          reported="$(node "$deploy_root/dist/bin.mjs" --version)"
          test "$reported" = "t3 v0.0.32"
          file "$deploy_root/dist/resource-monitor/linux-arm64/t3-resource-monitor" |
            grep -F 'ARM aarch64'

          mapfile -t pty_modules < <(find "$deploy_root/node_modules" -type f -path '*/build/Release/pty.node' -print)
          test "${#pty_modules[@]}" -ge 1
          for module in "${pty_modules[@]}"; do
            file "$module" | grep -F 'ARM aarch64'
          done

          install -d "$archive_root/bin" "$archive_root/lib"
          mv "$deploy_root" "$archive_root/lib/t3"
          install -m 0755 /dev/stdin "$archive_root/bin/t3" <<'EOF'
          #!/bin/sh
          set -eu
          runtime_bin=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "${T3CODE_NODE:-node}" "$runtime_bin/../lib/t3/dist/bin.mjs" "$@"
          EOF
          jq -n \
            --arg source_commit "$GITHUB_SHA" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            '{
              schema: 1,
              source_repository: $source_repository,
              source_commit: $source_commit,
              version: "0.0.32",
              platform: "linux-arm64-glibc",
              entrypoint: "bin/t3",
              t3_connect_public_config: false
            }' >"$archive_root/manifest.json"

          install -d "$output_root"
          tar \
            --sort=name \
            --mtime=@0 \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --pax-option=delete=atime,delete=ctime \
            -C "$RUNNER_TEMP" \
            -cf - \
            "$archive_name" |
            gzip -n -9 >"$output_root/$archive_name.tar.gz"
          sha256sum "$output_root/$archive_name.tar.gz" >"$output_root/$archive_name.tar.gz.sha256"

      - name: Attest the runtime archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/runtime-output/t3code-server-0.0.32-aaiyer.0-linux-arm64.tar.gz

      - name: Upload the runtime archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3code-server-0.0.32-aaiyer.0-linux-arm64
          path: ${{ runner.temp }}/runtime-output/*
          if-no-files-found: error
          retention-days: 7
